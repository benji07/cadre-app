name: Build macOS

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # Runner macOS standard (Apple Silicon, arm64) : gratuit sur un dépôt public.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Le tag et package.json sont posés ensemble par `npm version` (voir le
      # README). On ne fait que le vérifier, avant le `npm ci` : une erreur de
      # tag coûte quelques secondes au lieu d'un build complet.
      - name: Vérifier que le tag correspond à la version du package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::Le tag '$TAG' ne correspond pas à la version du package.json ($PKG). Posez le tag avec \`npm version\`."
            exit 1
          fi
          echo "Version de build : $PKG"

      - run: npm ci

      # `--publish never` : sans lui, electron-builder voit le tag git et tente de
      # publier lui-même, ce qui échoue faute de GH_TOKEN à cette étape. L'envoi
      # vers la release est le travail de l'étape suivante, explicitement.
      - name: Build (dmg + zip arm64)
        run: npm run build:mac -- --publish never

      - name: Attacher les artefacts à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber

      # Sur un déclenchement manuel, rien n'est publié : les fichiers restent
      # téléchargeables depuis la page du run, le temps de vérifier le build.
      - name: Publier les artefacts du run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cadre-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
